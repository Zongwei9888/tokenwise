name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # pi's grep and find tools need ripgrep; without it pi downloads one from GitHub, which fails now and then.
      - if: runner.os == 'Linux'
        run: command -v rg || (sudo apt-get update -q && sudo apt-get install -y -q ripgrep)
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
