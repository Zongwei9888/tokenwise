<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  /* The README's savings figure: one tile per kind of work, its best saving across the four models. */
  body { display: block; }
  .d { width: 1200px; padding: 34px 36px 36px; background: var(--paper); border-radius: 26px; }
  .d h2 { font-size: 52px; color: var(--ink); margin-bottom: 24px; }
  .zh .d h2 { font-size: 44px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .card { background: #fff; border: 1px solid var(--rule); border-radius: 20px; padding: 24px 24px 20px; display: flex; flex-direction: column; gap: 18px; }
  .card h3 { font-weight: 760; font-stretch: 84%; font-size: 24px; line-height: 1.2; min-height: 2.4em; color: var(--ink); }
  .zh .card h3 { font-stretch: 100%; font-size: 23px; }
  .hero { display: flex; flex-direction: column; gap: 6px; color: var(--teal); }
  .hero small { font-size: 18px; font-weight: 650; font-stretch: 90%; color: #3D5A55; white-space: nowrap; }
  .hero strong { font-size: 84px; font-weight: 820; font-stretch: 66%; line-height: .95; letter-spacing: -.02em; }
  .card.learn { background: var(--teal); border-color: var(--teal); }
  .card.learn h3, .card.learn .hero { color: #fff; }
  .card.learn .hero small { color: #D9FFF4; }
</style></head>
<body>
<div class="d" id="d"></div>
<script type="module">
const zh = new URLSearchParams(location.search).get('lang') === 'zh'
if (zh) document.body.classList.add('zh')

// From the paper's evaluation (total tokens per task or question, cache reads included), against
// DeepSeek Harness's own context management, for DeepSeek V4, MiniMax-M3, GLM-5.3 and Qwen3.8.
// Each tile shows the best of the four.
const SAVED = {
  coding: [38.2, 22.5, 20.3, 13.8],    // EvoAgentBench-SE, Table 1
  terminal: [27.4, 41.6, 50.2, 25.3],  // LongCLI-Bench, Table 2 (evolved policy)
  session: [21.1, 22.1, 44.6, 39.7],   // MemoryAgentBench, Table 3
  learned: [15.0, 27.2, 24.7, 12.0],   // LongCLI-Bench, evolved vs initial rules
}
const T = zh ? {
  title: '同样的任务，token 最多省一半', upto: '最多',
  tiles: [['coding', '修 bug、写功能'], ['terminal', '终端里的长任务'], ['session', '超长对话'], ['learned', '越用越省']],
} : {
  title: 'Same tasks. Up to half the tokens.', upto: 'up to',
  tiles: [['coding', 'Fixing bugs, building features'], ['terminal', 'Long jobs in the terminal'], ['session', 'Very long sessions'], ['learned', 'Saves more as it learns']],
}
const pct = v => `−${Math.round(v)}%`

document.getElementById('d').innerHTML = `<h2 class="display">${T.title}</h2>
  <div class="grid">${T.tiles.map(([k, h]) => `<div class="card${k === 'learned' ? ' learn' : ''}"><h3>${h}</h3>
    <div class="hero"><small>${T.upto}</small><strong>${pct(Math.max(...SAVED[k]))}</strong></div></div>`).join('')}</div>`

await document.fonts.ready
window.ready = true
</script>
</body></html>
